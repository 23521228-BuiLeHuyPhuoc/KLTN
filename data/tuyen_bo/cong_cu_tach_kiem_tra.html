điều hành tối ưu, tích hợp sức khỏe, thông báo và điều khiển thông minh.\n\nLời kêu gọi hành động:\nHãy sở hữu Galaxy Watch8 ngay hôm nay để trải nghiệm công nghệ đỉnh cao – Liên hệ cửa hàng hoặc đặt mua trực tuyến ngay bây giờ!"},{"ma":"qc-dh-samsung-galaxywatch8-gptoss-landing-ten-1","ma_mau":"dh-samsung-galaxywatch8","ten_mau":"Galaxy Watch8","nhom":"dong_ho","thong_tin":["openai/gpt-oss-120b","Landing page","chỉ nhập tên"],"van_ban":"Hero\n\nheadline: Trải nghiệm tương lai trên cổ tay với Galaxy Watch8\n\nSubheadline: Đồng hành thông minh, sức khỏe tối ưu và kết nối không giới hạn – mọi thứ bạn cần trong một chiếc đồng hồ thông minh.\n\nLợi ích chính: \n- Theo dõi sức khỏe 24/7 với cảm biến tim mạch, đo oxy trong máu và giấc ngủ sâu, giúp bạn duy trì phong cách sống lành mạnh. \n- Kết nối liền mạch với điện thoại, nhận thông báo, trả lời tin nhắn và thực hiện cuộc gọi chỉ bằng một cú chạm. \n- Thiết kế sang trọng, màn hình Super AMOLED luôn sáng rõ ngay cả trong ánh sáng mạnh, phù hợp mọi hoàn cảnh từ công sở đến thể thao.\n\nBằng chứng: Hơn 1,2 triệu người dùng trên toàn cầu đã tin dùng Galaxy Watch8, với đánh giá trung bình 4.8/5 trên các nền tảng thương mại điện tử. Được công nhận “Sản phẩm công nghệ xuất sắc năm 2024” bởi TechRadar, đồng hồ còn đi kèm bảo hành 2 năm và dịch vụ hỗ trợ khách hàng 24/7.\n\nOffer: Đặt mua ngay hôm nay để nhận ưu đãi giảm giá 15% + quà tặng phụ kiện dây đeo cao cấp, chỉ áp dụng cho 100 đơn hàng đầu tiên.\n\nLời kêu gọi hành động: Mua Ngay – Nhận Ngay Ưu Đãi!"},{"ma":"qc-dh-samsung-galaxywatch8-gptoss-social-ten_thong_so-1","ma_mau":"dh-samsung-galaxywatch8","ten_mau":"Galaxy Watch8","nhom":"dong_ho","thong_tin":["openai/gpt-oss-120b","Bài mạng xã hội","nhập tên và thông số"],"van_ban":"Hook: Bạn đã sẵn sàng nhìn mọi thông tin trên cổ tay, dù dưới ánh nắng chói chang?\n\nCaption: Galaxy Watch8 mang đến độ sáng lên tới 3.000 nits, khiến màn hình luôn rõ nét ngay cả dưới ánh sáng mặt trời mạnh nhất. Bạn có thể xem số liệu chạy bộ buổi sáng hay tin nhắn buổi chiều mà không lo mờ nhạt. Pin 325 mAh (40 mm) hoặc 435 mAh (44 mm) cho tới 30 giờ sử dụng liên tục ở chế độ Always On Display. Ngoài ra, thiết bị được chứng nhận kháng nước 5ATM, IPX8 và kháng bụi IP6X, sẵn sàng đồng hành trong mọi hoạt động thể thao và đời sống hàng ngày.\n\nLời kêu gọi hành động: Đặt mua ngay hôm nay để trải nghiệm công nghệ đỉnh cao trên cổ tay!\n\nHashtags: #GalaxyWatch8 #Smartwatch #CôngNghệ #ĐộSángCựcCao #KhảNăngChốngNước"},{"ma":"qc-dh-xiaomi-watchs4-gemini-description-ten_thong_so-1","ma_mau":"dh-xiaomi-watchs4","ten_mau":"Xiaomi Watch S4","nhom":"dong_ho","thong_tin":["gemini-3.6-flash","Mô tả sản phẩm","nhập tên và thông số"],"van_ban":"Phiên bản 1:\n\nMô tả ngắn:\nXiaomi Watch S4 là dòng đồng hồ thông minh thế hệ mới mang thiết kế thời lượng pin đột phá và phong cách sang trọng. Được trang bị hệ điều hành Xiaomi HyperOS 2 tiên tiến, sản phẩm mang lại trải nghiệm kết nối mượt mà và hỗ trợ tập luyện tối ưu cho cuộc sống hiện đại.\n\nLợi ích chính:\n- Tự tin sử dụng dài lâu mà không lo hết pin với thời lượng hoạt động lên đến 15 ngày và tính năng sạc nhanh 5 phút dùng đủ 2 ngày.\n- Đàm thoại dễ dàng và rõ ràng ngay trên cổ tay nhờ tích hợp 2 micrô chống ồn, loa ngoài chất lượng và kết nối Bluetooth 5.3 ổn định.\n\nĐặc điểm nổi bật:\n- Màn hình AMOLED 1,43 inch sắc nét với độ sáng cực đại 2.200 nit, tốc độ làm mới 60Hz và tính năng cảm ứng chống ẩm độc đáo.\n- Hệ thống định vị GNSS đa băng tần gồm GPS, Beidou, Glonass, Galileo, QZSS chuẩn xác cùng khả năng chống nước 5ATM vượt trội.\n\nLời kêu gọi hành động:\nHãy nâng tầm phong cách sống thông minh cùng Xiaomi Watch S4 ngay hôm nay. Đặt hàng ngay để nhận những ưu đãi đặc biệt nhất!"},{"ma":"qc-dh-xiaomi-watchs4-gemini-landing-ten-1","ma_mau":"dh-xiaomi-watchs4","ten_mau":"Xiaomi Watch S4","nhom":"dong_ho","thong_tin":["gemini-3.6-flash","Landing page","chỉ nhập tên"],"van_ban":"Phiên bản 1:\n\nHero headline: Xiaomi Watch S4: Tuyệt Phẩm Đồng Hồ Thông Minh Cho Cuộc Số rong …, sạc … phút dùng … giờ"},{"ma":"do_sang","y_nghia":"Độ sáng màn hình (nit)","dau_hieu":"nit"},{"ma":"khang_nuoc","y_nghia":"Chống nước, bụi (độ sâu tính bằng mét, chuẩn ISO, mã IP)","dau_hieu":"IP…, ATM, mét, ISO 22810, phút ngâm"}]},"mau_thuoc_tinh":{"thoi_luong_pin":"#1e88e5","sac_nhanh":"#fb8c00","cong_suat_sac":"#8e24aa","do_sang":"#9e9d24","tan_so_quet":"#00897b","zoom":"#d81b60","khang_nuoc":"#00838f","dung_luong_pin":"#6d4c41"},"cum_khen":["cả ngày","suốt ngày dài","không lo hết pin","siêu bền","bền bỉ","vượt trội","tuyệt đối","trọn vẹn","không giới hạn"],"huong_dan":{"quy_tac_html":"\u003col>\u003cli>\u003cstrong>Một dòng chỉ một thuộc tính và một con số.\u003c/strong> Câu \"pin 30 giờ, sạc 50% trong 20 phút\" tách thành 2 dòng.\u003c/li>\u003cli>\u003cstrong>Giữ ngữ cảnh.\u003c/strong> Thêm tên sản phẩm. Điều kiện thuộc con số thì đưa vào tuyên bố, kể cả khi nằm ở câu trước hoặc câu sau. Điều kiện nào thuộc con số thì xem \u003cstrong>tiêu chí gắn điều kiện\u003c/strong> bên dưới. Ví dụ bài viết \"Khi bật chống ồn, bạn vẫn có... lên đến 6 giờ\" thì ghi \"Galaxy Buds3 Pro nghe nhạc lên đến 6 giờ khi bật chống ồn\".\u003c/li>\u003cli>\u003cstrong>Không thêm điều kiện bài không nói, không sửa con số.\u003c/strong> Bài ghi \"pin 30 giờ\" mà không nói xem video thì tuyên bố cũng không có \"xem video\". Giữ chữ \"lên đến\" nếu bài có. Từ khẳng định (\"luôn\", \"đảm bảo\", \"ít nhất\", \"mọi lúc\", \"hơn\", \"trên\", \"không dưới\", \"trở lên\") chỉ giữ khi nó gắn với con số (tiêu chí 3 bên dưới).\u003c/li>\u003cli>\u003cstrong>Không phán đúng sai.\u003c/strong> Câu sai thông số vẫn tách bình thường; gán nhãn là việc của bước gán nhãn (Bước 13, 20, 24).\u003c/li>\u003cli>\u003cstrong>Gộp tuyên bố trùng trong cùng bài\u003c/strong> chỉ khi hai lần nhắc cùng con số và cùng điều kiện; khi đó ghi một dòng. Bài nhắc một con số hai lần, một lần kèm điều kiện, một lần không (ví dụ ở tiêu đề và ở cuối câu), thì ghi hai dòng: người đọc lướt có thể chỉ thấy lần không kèm điều kiện.\u003c/li>\u003c/ol>","tieu_chi_html":"\u003cp>Dùng khi tách (quy tắc 2, 3, 5) và khi rà lại tuyên bố trước lúc gán nhãn. Nguồn: hướng dẫn gán nhãn bản 2, mục 2.\u003c/p>\n\u003col>\u003cli>\u003cstrong>Điều kiện bổ nghĩa trực tiếp cho con số thì thuộc con số:\u003c/strong> cùng cụm, trong ngoặc ngay sau con số, hoặc \"khi / ở / với / trong / dưới / cùng / kèm …\" đi liền con số.\u003c/li>\u003cli>\u003cstrong>Điều kiện cụ thể ở vế nói tác dụng của chính con số thì thuộc con số\u003c/strong> (\"… 2500 nit giúp nhìn rõ dưới nắng\"). Nếu con số đã có điều kiện trực tiếp cùng loại thì điều kiện trực tiếp thắng.\u003c/li>\u003cli>\u003cstrong>Điều kiện hay từ khẳng định ở vế nói về tính năng hay việc khác thì không thuộc con số.\u003c/strong> Ví dụ \"luôn giữ kết nối ổn định, pin 8 giờ\": \"luôn\" thuộc vế kết nối, không đưa vào tuyên bố về pin.\u003c/li>\u003cli>\u003cstrong>Một con số nhắc hai lần, một lần kèm điều kiện, một lần không, thì là hai tuyên bố\u003c/strong> (quy tắc 5).\u003c/li>\u003c/ol>"}}</script>

function themDong(m) {

  const b = bai(), d = {id: 'd' + st.tiep, t: st.tiep, bd: dangChon.bd, cau_goc: b.van_ban.slice(dangChon.bd, dangChon.kt), thuoc_tinh: m, tuyen_bo: '', ghi_chu: '', nhap: true};
  d.tuyen_bo = nhapTuyenBo(d.cau_goc, b.ten_mau);
  st.tiep++;
  tBai(b.ma).dong.push(d);
  if (tBai(b.ma).xong === 'khong') tBai(b.ma).xong = '';
  luu(); window.getSelection().removeAllRanges(); an(); veBai();
  const kt = document.querySelector('#dong-' + d.id);
  if (kt) { kt.scrollIntoView({block: 'nearest'}); kt.querySelector('textarea').focus(); }
}
document.addEventListener('mouseup', (ev) => { if (!$('thanh-chon').contains(ev.target)) setTimeout(hienThanh, 0); });  // thả chuột ngoài khung bài vẫn hiện thanh
$('van').addEventListener('keyup', (ev) => { if (ev.shiftKey) hienThanh(); });
document.addEventListener('mousedown', (ev) => { if (!$('thanh-chon').contains(ev.target)) an(); });
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape') { an(); $('hd').style.display = 'none'; return; }
  if (!dangChon || ev.ctrlKey || ev.metaKey || ev.altKey || /^(INPUT|TEXTAREA|SELECT)$/.test((ev.target.tagName || ''))) return;
  const i = parseInt(ev.key, 10);
  if (i >= 1 && i <= bai().ds_tt.length) { ev.preventDefault(); themDong(bai().ds_tt[i - 1]); }
});

/* ---- Nút trên đầu trang ---- */
$('loc').onchange = veTrai;
$('chk-so').checked = !!gd.so;
$('chk-so').onchange = () => { gd.so = $('chk-so').checked; luuGd(); veGiua(); };
$('nut-hd').onclick = () => { const p = $('hd'); p.style.display = p.style.display === 'block' ? 'none' : 'block'; };
$('nut-tiep').onclick = () => {
  const k = BAI.findIndex((b) => b.ma === gd.chon);
  for (let i = 1; i <= BAI.length; i++) { const b = BAI[(k + i) % BAI.length]; if (!tBai(b.ma).xong) { chonBai(b.ma); return; } }
  alert('Mọi bài đã xong.');
};
$('nut-xong').onclick = () => {
  const t = tBai(gd.chon);
  if (t.xong === 'co') t.xong = '';
  else if (!t.dong.length) { alert('Bài chưa có dòng nào. Nếu bài không có câu nào cần tách, bấm "Bài không có câu nào".'); return; }
  else t.xong = 'co';
  luu(); veBai();
};
$('nut-khong').onclick = () => {
  const t = tBai(gd.chon);
  if (t.xong === 'khong') t.xong = '';
  else if (t.dong.length) { alert('Bài đang có ' + t.dong.length + ' dòng. Xóa hết dòng trước, hoặc bấm "Xong bài".'); return; }
  else t.xong = 'khong';
  luu(); veBai();
};
function taiXuong(ten, noi, kieu) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([noi], {type: kieu})); a.download = ten;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
$('nut-csv').onclick = () => {
  const thieu = BAI.reduce((s, b) => s + thieuBai(b), 0), chua = BAI.filter((b) => !tBai(b.ma).xong).length;
  const nhap = BAI.reduce((s, b) => s + tBai(b.ma).dong.filter((d) => d.nhap === true).length, 0);
  if ((thieu || chua || nhap) && !confirm('Còn ' + thieu + ' dòng thiếu tuyên bố, ' + nhap + ' dòng còn là bản nháp chưa sửa và ' + chua +
      ' bài chưa xong. Vẫn xuất CSV?')) return;
  taiXuong(DL.tep_csv, taoCsv(BAI, st, DL.cot_csv), 'text/csv;charset=utf-8');
};
$('nut-sao-luu').onclick = () => taiXuong('sao_luu_' + KHOA + '.json', JSON.stringify({phien_ban: 1, khoa: KHOA, bai: st.bai}, null, 1), 'application/json');
$('nut-nhap').onclick = () => $('tep-nhap').click();
$('tep-nhap').onchange = () => {
  const f = $('tep-nhap').files[0]; $('tep-nhap').value = '';
  if (!f) return;
  f.text().then((chu) => {
    let du; try { du = JSON.parse(chu); } catch (x) { alert('Tệp không phải JSON.'); return; }
    const kq = nhapTrangThai(du, BAI), so = BAI.reduce((s, b) => s + kq.st.bai[b.ma].dong.length, 0);
    if (!confirm('Khôi phục ' + so + ' dòng, thay toàn bộ dữ liệu hiện có. Bỏ qua ' + kq.boQua + ' dòng' +
        (kq.baiLa.length ? ' (mã bài không có trong trang: ' + kq.baiLa.join(', ') + ')' : '') + '. Tiếp tục?')) return;
    st = kq.st; luu(); veBai(); veHuongDan();
  });
};

$('chk-so').checked = !!gd.so;
veHuongDan(); veBai();
if (!luuDuoc) $('chu-tien-do').title = 'Trình duyệt đang chặn localStorage: dữ liệu không được nhớ, hãy dùng Sao lưu JSON.';

</script>
