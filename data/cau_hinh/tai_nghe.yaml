# Tệp cấu hình nhóm tai nghe (Bước 8). Căn cứ: data/cau_hinh/bao_phu_dieu_kien.md, mục 3.
# Tập phát triển của nhóm chỉ có tn-samsung-buds3pro; phần không có bằng chứng ghi can_cu: hieu_biet_chung.
nhom: tai_nghe
ke_thua: chung.yaml

thuoc_tinh:
  thoi_luong_pin:
    don_vi: gio
    huong_thuan_loi: cao_hon_tot_hon
    kieu_gia_tri_mac_dinh: toi_da           # như hãng công bố; bỏ "lên đến" vẫn khớp (điểm 2, T10)
    dieu_kien_bat_buoc:
      che_do_chong_on: che_do_hoat_dong
      bo_phan: bo_phan
      hoat_dong: che_do_hoat_dong
    hieu_thong_thuong:
      che_do_chong_on: bat                 # Samsung: "ANC được bật theo mặc định"; xác nhận ở Bước 10
      bo_phan: tai_nghe
      hoat_dong: nghe_nhac                 # xác nhận ở Bước 10
    pham_vi_ap_dung:
      che_do_chong_on: tai nghe có chống ồn chủ động; tài liệu ghi không có thì không áp dụng
      bo_phan: tai nghe có hộp sạc
      hoat_dong: khi hãng công bố riêng theo hoạt động
    # Bước 22: dòng "a / b giờ" không ghi bộ phận (#038 "Đến 7 / 30 giờ", #042) đọc số nhỏ là tai nghe, số lớn là tổng kèm hộp sạc;
    # căn cứ chú thích #038 "tai nghe và hộp tai nghe cung cấp tối đa 30 giờ" và cách đọc của hướng dẫn ("số 6 trong '6 / 26'").
    cap_so_gach_cheo: [tai_nghe, kem_hop_sac]
    can_cu: [tn-samsung-buds3pro#038, tn-samsung-buds3pro#044, tn-samsung-buds3pro#020]

  sac_nhanh:                               # số giờ dùng sau X phút sạc
    don_vi: gio
    huong_thuan_loi: cao_hon_tot_hon
    kieu_gia_tri_mac_dinh: toi_da           # như hãng công bố (điểm 2, T10)
    dieu_kien_bat_buoc:
      so_phut_sac: dieu_kien_do
      bo_phan: bo_phan
    hieu_thong_thuong:
      so_phut_sac: khong_co_mac_dinh
      bo_phan: tai_nghe
    pham_vi_ap_dung:
      bo_phan: tai nghe có hộp sạc
    dieu_kien_so:                          # sạc lâu hơn mức hãng ghi thì vẫn đạt số giờ đó
      so_phut_sac: {don_vi: phut, thoa_khi: tuyen_bo_lon_hon_hoac_bang}
    can_cu: hieu_biet_chung                # Buds3 Pro không công bố sạc nhanh

  khang_nuoc:
    don_vi: ma_ip
    huong_thuan_loi: theo_nhanh_ip
    kieu_gia_tri_mac_dinh: nhu_hang_cong_bo
    dieu_kien_bat_buoc:
      bo_phan: bo_phan
      do_sau: dieu_kien_do
      thoi_gian_ngam: dieu_kien_do
      loai_nuoc: dieu_kien_do
      hoat_dong_bi_cam: dieu_kien_do
    hieu_thong_thuong:
      bo_phan: tai_nghe
      do_sau: nhu_hang_cong_bo
      thoi_gian_ngam: nhu_hang_cong_bo
      loai_nuoc: nhu_hang_cong_bo
      hoat_dong_bi_cam: nhu_hang_cong_bo
    pham_vi_ap_dung:
      bo_phan: hộp sạc không kháng nước thì quảng cáo nói hộp sạc kháng nước là Sai
      hoat_dong_bi_cam: khi hãng nêu
    dieu_kien_so:                          # Buds3 Pro: ngâm 1 m nước ngọt, tối đa 30 phút
      do_sau: {don_vi: m, thoa_khi: tuyen_bo_nho_hon_hoac_bang}
      thoi_gian_ngam: {don_vi: phut, thoa_khi: tuyen_bo_nho_hon_hoac_bang}
    can_cu: [tn-samsung-buds3pro#044, tn-samsung-buds3pro#038]

  dung_luong_pin:
    don_vi: mAh
    huong_thuan_loi: cao_hon_tot_hon
    kieu_gia_tri_mac_dinh: dien_hinh
    dieu_kien_bat_buoc:
      bo_phan: bo_phan
    hieu_thong_thuong:
      bo_phan: tai_nghe
    pham_vi_ap_dung:
      bo_phan: tai nghe có hộp sạc
    can_cu: [tn-samsung-buds3pro#044]

cach_dien_dat:
  che_do_chong_on:
    bat:
      tu_tai_lieu: ["bật ANC", "Tính năng ANC Bật", "BẬT Tính năng ANC"]
      hieu_biet_chung: ["bật chống ồn", "bật khử ồn", "khử tiếng ồn chủ động", "chống ồn chủ động"]
    tat:
      tu_tai_lieu: ["tắt ANC", "Tính năng ANC Tắt", "Tắt Tính năng ANC"]
      hieu_biet_chung: ["tắt chống ồn", "tắt khử ồn"]
    xuyen_am:                              # hãng không công bố số liệu; quảng cáo nêu thì chưa xác định
      tu_tai_lieu: ["Ambient", "Môi trường xung quanh"]
      hieu_biet_chung: ["xuyên âm", "âm thanh xung quanh"]
  bo_phan:
    tai_nghe:
      tu_tai_lieu: ["tai nghe"]
      hieu_biet_chung: ["riêng tai nghe", "mỗi lần sạc"]
    hop_sac:
      tu_tai_lieu: ["hộp sạc"]
      hieu_biet_chung: ["case"]
    # Bước 16, QĐ2 ý 6: "tổng", "tổng cộng", "kèm / cùng / kết hợp hộp sạc" là kèm hộp sạc. "Hộp sạc" đứng riêng làm chủ ngữ
    # ("hộp sạc cho thêm …") là bộ phận hop_sac; ngữ cảnh đó không biểu diễn được bằng cụm, người gán đọc ở mục 6.8.
    # chi_thuoc_tinh (Bước 16, rà soát 02/11): cụm chỉ là điều kiện của các thuộc tính liệt kê; mục 6.8 ý 6 chỉ nói cho thời lượng pin.
    # "có kèm hộp sạc 515 mAh" (dung lượng pin) hay "kèm hộp sạc" ở kháng nước không phải bộ phận "tổng kèm hộp sạc".
    kem_hop_sac:
      chi_thuoc_tinh: [thoi_luong_pin]
      tu_tai_lieu: ["Tổng thời gian", "tai nghe và hộp tai nghe"]
      hieu_biet_chung: ["kèm hộp sạc", "tính cả hộp sạc", "cùng hộp sạc", "tổng cộng", "kết hợp hộp sạc"]
  hoat_dong:
    nghe_nhac:
      tu_tai_lieu: ["phát nhạc", "Thời gian phát"]
      hieu_biet_chung: ["nghe nhạc"]
    dam_thoai:
      tu_tai_lieu: ["đàm thoại"]
      hieu_biet_chung: ["gọi điện", "nghe gọi", "thời gian thoại"]
    # Hướng dẫn mục 6.8 ý 3 và QĐ12 (Bước 16, 02/11): phía tuyên bố, cụm chỉ sự liên tục hay mức dùng chung không nêu hoạt động cụ
    # thể; coi như chưa nêu, áp hieu_thong_thuong (nghe_nhac). Như dien_thoai.yaml.
    chua_ro_hoat_dong:
      phia: tuyen_bo
      tu_tai_lieu: []
      hieu_biet_chung: ["sử dụng liên tục", "dùng liên tục", "liên tục", "sử dụng", "dùng"]
  so_phut_sac:
    gia_tri_so:
      tu_tai_lieu: []
      hieu_biet_chung: ["sạc nhanh", "phút sạc"]
  do_sau:
    gia_tri_so:
      tu_tai_lieu: ["1 mét"]
      hieu_biet_chung: ["ngâm", "dưới nước"]
  thoi_gian_ngam:
    gia_tri_so:
      tu_tai_lieu: ["tối đa 30 phút"]
      hieu_biet_chung: []
  loai_nuoc:
    nuoc_ngot:
      tu_tai_lieu: ["nước ngọt"]
      hieu_biet_chung: []
    nuoc_khac:
      tu_tai_lieu: []
      hieu_biet_chung: ["nước biển", "nước clo", "hồ bơi"]
  hoat_dong_bi_cam:
    tam_bien_be_boi:
      tu_tai_lieu: ["tắm biển", "bể bơi"]
      hieu_biet_chung: ["đi bơi", "bơi lội"]

