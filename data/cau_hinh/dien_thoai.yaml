    bi_danh: ["iPhone 17", "Apple iPhone 17"]
    khong_nham_voi: ["iPhone 17 Pro", "iPhone 17 Pro Max", "iPhone 17e", "iPhone Air", "iPhone 16"]
    phien_ban: Bản Việt Nam
  dt-xiaomi-15t:
    ten: Xiaomi 15T
    bi_danh: ["Xiaomi 15T"]
